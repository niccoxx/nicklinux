name: Build ISO

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Libera spazio sul runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Costruisci la ISO
        run: |
          set -o pipefail
          sudo ENGINE=docker bash ./build.sh 2>&1 | tee build.log

      - name: Riassunto errori
        if: failure()
        run: |
          ls -la out/anaconda || true
          for f in out/anaconda/*.log; do
            [ -f "$f" ] || continue
            msg=$(sudo grep -iE "error|fail|conflict|cannot|problem" "$f" | grep -v "Downloading" | tail -n 40 | sed 's/%/%25/g; s/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$msg"
          done

      - name: Checksum
        run: cd out/result && sudo sha256sum *.iso | sudo tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: iso
          path: |
            out/result/*.iso
            out/result/SHA256SUMS
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            build.log
            out/*.log
            out/flat.ks
            out/anaconda/
